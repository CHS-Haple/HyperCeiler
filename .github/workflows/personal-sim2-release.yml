name: Personal CPU + Provider Snapshot Validation Release (Fork Only)

on:
  push:
    branches:
      - personal/cpu-provider-snapshot-v2
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: personal-cpu-provider-v2-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_host_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Native hook and desktop host regression suites
        run: bash tests/run_host_native_tests.sh
      - name: Zero-length maps and image inventory regressions (4K + 16K)
        run: python3 tests/hyos-image-inventory/run.py
      - name: Home layout and atomic provider/haptic snapshot regressions
        run: |
          python3 tests/home-layout-native/run_idle_snapshot.py
          python3 tests/home-layout-native/run_atomic_reload.py

  release:
    needs: native_host_tests
    if: github.repository == 'CHS-Haple/HyperCeiler'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GIT_ACTOR: ${{ github.actor }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record immutable build input
        run: |
          test "$GITHUB_REPOSITORY" = "CHS-Haple/HyperCeiler"
          test "$GITHUB_REF_NAME" = "personal/cpu-provider-snapshot-v2"
          git rev-parse HEAD
          git status --porcelain

      # Use only the fork owner's existing signing secrets when ALL are present.
      # If no signing secrets are configured, the project itself selects the
      # Android SDK debug certificate for signing its NON-DEBUG Release variant.
      # This fallback is for personal installations only and cannot update
      # an official APK signed with a different certificate.
      - name: Configure existing fork signing if available
        env:
          KEY_B64: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" && -z "$STORE_PASSWORD" && -z "$SIGN_ALIAS" ]]; then
            echo "No fork signing secrets configured: Release variant will use Android debug certificate (not a Debug APK)."
            exit 0
          fi
          if [[ -z "$KEY_B64" || -z "$STORE_PASSWORD" || -z "$SIGN_ALIAS" ]]; then
            echo "::error::Fork signing secrets are only partially configured; refusing ambiguous signing."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path("key.jks").write_bytes(base64.b64decode(os.environ["KEY_B64"], validate=True))
          values = {
              "storeFile": "../key.jks",
              "storePassword": os.environ["STORE_PASSWORD"],
              "keyAlias": os.environ["SIGN_ALIAS"],
              "keyPassword": os.environ["STORE_PASSWORD"],
          }
          Path("signing.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          echo "Existing fork signing key configured."

      - name: Build optimized, non-debug Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify Release APK and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          sdk_apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$sdk_apksigner"
          "$sdk_apksigner" verify --verbose --print-certs "$apk"
          shasum -a 256 "$apk"
          echo "### Personal Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Variant: Release, not Debug" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f signing.properties ]]; then
            echo "Signing: existing fork signing key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signing: Android SDK debug certificate (self-use fallback, not official signature)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "SHA-256: \`$(shasum -a 256 "$apk" | awk '{print $1}')\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload personal Release APK
        uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-CPU-Provider-Snapshot-Validation-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
