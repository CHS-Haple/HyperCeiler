name: SIM2 Debug Build (Fork Only)

on:
  push:
    branches:
      - fix/dual-row-sim2-data-activity
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sim2-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    if: github.repository == 'CHS-Haple/HyperCeiler'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GIT_ACTOR: ${{ github.actor }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify build input
        run: |
          test "${GITHUB_REPOSITORY}" = "CHS-Haple/HyperCeiler"
          test "${GITHUB_REF_NAME}" = "fix/dual-row-sim2-data-activity"
          git status --short
          git rev-parse HEAD

      # Keep a stable *debug-only* signing key for repeat test builds.
      # This does not use or expose the official publishing certificate.
      - name: Cache fork debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hyperceiler-sim2-debug-signing-v1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: APK SHA-256
        run: |
          shasum -a 256 app/build/outputs/apk/debug/*.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: hyperceiler-sim2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
